# machine_slow_memory.cfg - practice machine: slow loads and slow multiply
# The judges will also run your optimizer on other machine files with the same keys
# and different values. Every key below must be present exactly once.
# See KIR_SPEC.md ("Machine model") for what each key means.

issue_width          = 2    # instructions that may issue in one cycle
mem_ports            = 1    # memory instructions (load, store, vload, vstore) per cycle
registers            = 8    # K: number of hardware registers
reg_spill_penalty    = 5    # extra cycles when a spilled register is used again
taken_branch_penalty = 2    # extra cycles after a jump/branch that leaves the layout order
icache_size          = 64   # instructions that fit in the instruction cache
icache_penalty       = 2    # extra fetch cycles for each executed instruction beyond icache_size

lat_alu              = 1    # const mov add sub and or xor shl shr lt eq select
lat_mul              = 5    # mul
lat_div              = 12   # div mod
lat_load             = 12   # load vload
lat_mac              = 5    # mac
lat_addsh            = 1    # addsh

fused_mac            = 1    # 1 = the mac instruction exists on this machine, 0 = it does not
fused_addsh          = 1    # 1 = the addsh instruction exists on this machine, 0 = it does not
