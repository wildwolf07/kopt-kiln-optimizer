name: Judge compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-2204:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build with the judge compiler
        env:
          CXX: g++-11
        run: |
          g++-11 --version
          ./build.sh
          g++-11 -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -o build/kopt-bin src/*.cpp
      - name: Check semantics, determinism and command-line entry points
        run: python3 tools/smoke.py
      - name: Check range facts cannot leak between SSA functions
        env:
          CXX: g++-11
        run: python3 tests/range_cache.py --kit-free
      - name: Check dense-live-set limits with an independent arithmetic oracle
        run: python3 tests/pressure.py
